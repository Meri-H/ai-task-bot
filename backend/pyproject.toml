[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-task-bot"
version = "1.0.0"
description = "Omni-channel task manager: Telegram bot (text + voice) -> Redis queue -> Postgres -> live dashboard"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "redis>=5.0",
  "arq>=0.26",
  "aiogram>=3.10",
  "httpx>=0.27",
]

[project.optional-dependencies]
# Offline transcription (faster-whisper). Not needed when using the OpenAI API only.
# Keep the decoder compatible with faster-whisper's metadata_errors argument.
local = ["faster-whisper==1.2.1", "av==16.1.0"]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "websockets>=12",
  "pytest-timeout>=2.3",
  "ruff>=0.5",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
  "e2e: spawns api/bot/worker processes against fake Telegram/OpenAI servers (needs Postgres + Redis)",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom puts Depends()/Query() in argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]
